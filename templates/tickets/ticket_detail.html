{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Ticket Detail</title>


<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    body {
        font-family: Arial, sans-serif;

        background: linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 30px 20px;
    }


    /* Main Container */

    .ticket-container {
        width: 100%;
        max-width: 800px;

        padding: 40px;

        background: #ffffff;

        border-radius: 15px;

        box-shadow:
            0 15px 35px rgba(0, 0, 0, 0.2);
    }


    /* Ticket Title */

    .ticket-container h2 {
        color: #333;

        font-size: 28px;

        line-height: 1.4;

        margin-bottom: 25px;

        padding-bottom: 20px;

        border-bottom: 1px solid #eee;
    }


    /* Ticket Information */

    .ticket-info {
        background: #f8f9ff;

        padding: 18px 20px;

        border-radius: 10px;

        border: 1px solid #e5e7f5;

        margin-bottom: 25px;
    }


    .ticket-info p {
        margin: 8px 0;

        color: #555;

        font-size: 14px;
    }


    .ticket-info strong {
        color: #333;
    }


    /* Message Title */

    .ticket-container h4 {
        color: #444;

        font-size: 18px;

        margin-bottom: 12px;
    }


    /* Message */

    .ticket-message {
        background: #f8f9ff;

        padding: 22px;

        border-radius: 10px;

        border: 1px solid #e5e7f5;

        color: #555;

        line-height: 1.8;

        font-size: 15px;

        white-space: pre-wrap;

        word-wrap: break-word;

        min-height: 100px;
    }


    /* Actions */

    .ticket-actions {
        display: flex;

        flex-wrap: wrap;

        gap: 10px;

        margin-top: 30px;

        padding-top: 25px;

        border-top: 1px solid #eee;
    }


    .ticket-actions a {
        display: inline-block;

        padding: 11px 17px;

        background: #667eea;

        color: white;

        text-decoration: none;

        border-radius: 8px;

        font-size: 14px;

        font-weight: bold;

        transition: 0.3s;
    }


    .ticket-actions a:hover {
        background: #5568d8;

        transform: translateY(-1px);
    }


    /* Create New Ticket */

    .ticket-actions a:last-child {
        background: #764ba2;
    }


    .ticket-actions a:last-child:hover {
        background: #653d8b;
    }


    /* Mobile */

    @media (max-width: 600px) {

        body {
            padding: 20px 15px;

            align-items: flex-start;
        }


        .ticket-container {
            margin-top: 20px;

            padding: 30px 22px;
        }


        .ticket-container h2 {
            font-size: 23px;
        }


        .ticket-actions {
            flex-direction: column;
        }


        .ticket-actions a {
            width: 100%;

            text-align: center;
        }

    }

</style>


</head>

<body>


<div class="ticket-container">


    <h2>
        {{ ticket.subject }}
    </h2>


    <div class="ticket-info">

        <p>
            <strong>From:</strong>
            {{ ticket.sender.username }}
        </p>


        <p>
            <strong>Date:</strong>
            {{ ticket.created_at }}
        </p>

    </div>


    <h4>
        Message
    </h4>


    <div class="ticket-message">

        {{ ticket.message }}

    </div>


    <div class="ticket-actions">

        <a href="{% url 'website:index' %}">
            Back to Home
        </a>


        <a href="{% url 'accounts:ticket-list' %}">
            Back to Tickets List
        </a>


        <a href="{% url 'accounts:create-ticket' %}">
            Create New Ticket
        </a>

    </div>


</div>


</body>

</html>
