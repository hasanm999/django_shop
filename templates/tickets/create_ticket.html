{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Create Ticket</title>


<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    body {
        font-family: Arial, sans-serif;

        background: linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 30px 20px;
    }


    /* Main Container */

    .ticket-container {
        width: 100%;
        max-width: 700px;

        background: #ffffff;

        padding: 40px;

        border-radius: 15px;

        box-shadow:
            0 15px 35px rgba(0, 0, 0, 0.2);
    }


    /* Title */

    .ticket-container h2 {
        text-align: center;

        margin-bottom: 30px;

        color: #333;

        font-size: 30px;
    }


    /* Form */

    .ticket-container form p {
        margin-bottom: 20px;
    }


    /* Labels */

    .ticket-container label {
        display: block;

        margin-bottom: 7px;

        color: #444;

        font-size: 14px;

        font-weight: bold;
    }


    /* Inputs */

    .ticket-container input,
    .ticket-container textarea,
    .ticket-container select {

        width: 100%;

        padding: 13px 15px;

        border: 1px solid #ddd;

        border-radius: 8px;

        background: #fff;

        color: #333;

        font-family: Arial, sans-serif;

        font-size: 15px;

        outline: none;

        transition: 0.3s;
    }


    /* Textarea */

    .ticket-container textarea {
        min-height: 180px;

        resize: vertical;

        line-height: 1.6;
    }


    /* Focus */

    .ticket-container input:focus,
    .ticket-container textarea:focus,
    .ticket-container select:focus {

        border-color: #667eea;

        box-shadow:
            0 0 0 3px
            rgba(102, 126, 234, 0.15);
    }


    /* Help Text */

    .ticket-container .helptext {

        display: block;

        margin-top: 6px;

        color: #777;

        font-size: 12px;

        line-height: 1.5;
    }


    /* Error Messages */

    .ticket-container .errorlist {

        list-style: none;

        color: #d93025;

        background: #ffe5e5;

        padding: 8px 10px;

        margin-bottom: 8px;

        border-radius: 6px;

        font-size: 13px;
    }


    /* Submit Button */

    .submit-button {

        width: 100%;

        padding: 13px;

        margin-top: 5px;

        border: none;

        border-radius: 8px;

        background: #667eea;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }


    .submit-button:hover {

        background: #5568d8;

        transform: translateY(-1px);
    }


    /* Bottom Links */

    .ticket-links {

        display: flex;

        gap: 10px;

        margin-top: 30px;

        padding-top: 25px;

        border-top: 1px solid #eee;
    }


    .ticket-links a {

        flex: 1;

        padding: 11px 15px;

        border-radius: 8px;

        background: #667eea;

        color: white;

        text-decoration: none;

        text-align: center;

        font-size: 14px;

        font-weight: bold;

        transition: 0.3s;
    }


    .ticket-links a:hover {

        background: #5568d8;

        transform: translateY(-1px);
    }


    /* Profile Link */

    .ticket-links .profile-link {

        background: #764ba2;
    }


    .ticket-links .profile-link:hover {

        background: #653d8b;
    }


    /* Mobile */

    @media (max-width: 600px) {

        body {

            padding: 20px 15px;

            align-items: flex-start;
        }


        .ticket-container {

            margin-top: 20px;

            padding: 30px 22px;
        }


        .ticket-container h2 {

            font-size: 26px;
        }


        .ticket-links {

            flex-direction: column;
        }


        .ticket-links a {

            width: 100%;
        }

    }

</style>


</head>

<body>


<div class="ticket-container">


    <h2>
        Create Ticket
    </h2>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button
            type="submit"
            class="submit-button"
        >
            Submit Ticket
        </button>

    </form>


    <div class="ticket-links">

        <a href="{% url 'accounts:ticket-list' %}">
            Back to Tickets List
        </a>


        <a
            href="{% url 'accounts:profile' %}"
            class="profile-link"
        >
            Back to Profile
        </a>

    </div>


</div>


</body>

</html>
