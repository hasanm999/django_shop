{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Profile</title>


<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    body {
        font-family: Arial, sans-serif;

        background: linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 30px 20px;
    }


    /* Main Profile Container */

    .profile-container {
        width: 100%;
        max-width: 700px;

        background: #ffffff;

        padding: 40px;

        border-radius: 15px;

        box-shadow:
            0 15px 35px rgba(0, 0, 0, 0.2);
    }


    /* Main Title */

    .profile-container h2 {
        text-align: center;

        margin-bottom: 30px;

        color: #333;

        font-size: 30px;
    }


    /* Section Titles */

    .profile-container h3 {
        margin-top: 25px;
        margin-bottom: 18px;

        padding-bottom: 10px;

        border-bottom: 1px solid #eee;

        color: #444;

        font-size: 19px;
    }


    /* Django Form */

    .profile-container form p {
        margin-bottom: 18px;
    }


    .profile-container label {
        display: block;

        margin-bottom: 7px;

        color: #444;

        font-size: 14px;

        font-weight: bold;
    }


    .profile-container input {
        width: 100%;

        padding: 13px 15px;

        border: 1px solid #ddd;

        border-radius: 8px;

        font-size: 15px;

        outline: none;

        transition: 0.3s;
    }


    .profile-container input:focus {
        border-color: #667eea;

        box-shadow:
            0 0 0 3px
            rgba(102, 126, 234, 0.15);
    }


    /* Help Text */

    .profile-container .helptext {
        display: block;

        margin-top: 6px;

        color: #777;

        font-size: 12px;

        line-height: 1.5;
    }


    /* Error Messages */

    .profile-container .errorlist {
        list-style: none;

        color: #d93025;

        background: #ffe5e5;

        padding: 8px 10px;

        margin-bottom: 8px;

        border-radius: 6px;

        font-size: 13px;
    }


    /* Save Button */

    .save-button {
        width: 100%;

        padding: 13px;

        margin-top: 5px;

        border: none;

        border-radius: 8px;

        background: #667eea;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }


    .save-button:hover {
        background: #5568d8;

        transform: translateY(-1px);
    }


    /* Links Section */

    .profile-links {
        display: flex;

        flex-wrap: wrap;

        gap: 10px;

        margin-top: 30px;

        padding-top: 25px;

        border-top: 1px solid #eee;
    }


    /* General Links */

    .profile-links a {
        flex: 1;

        min-width: 140px;

        padding: 11px 15px;

        border-radius: 8px;

        background: #667eea;

        color: white;

        text-decoration: none;

        text-align: center;

        font-size: 14px;

        font-weight: bold;

        transition: 0.3s;
    }


    .profile-links a:hover {
        background: #5568d8;

        transform: translateY(-1px);
    }


    /* Ticket Links */

    .profile-links .ticket-link {
        background: #764ba2;
    }


    .profile-links .ticket-link:hover {
        background: #653d8b;
    }


    /* Logout */

    .profile-links .logout-link {
        background: #dc3545;
    }


    .profile-links .logout-link:hover {
        background: #c82333;
    }


    /* Mobile */

    @media (max-width: 600px) {

        body {
            padding: 20px 15px;
        }


        .profile-container {
            padding: 30px 25px;
        }


        .profile-container h2 {
            font-size: 26px;
        }


        .profile-links {
            flex-direction: column;
        }


        .profile-links a {
            width: 100%;
        }

    }

</style>


</head>

<body>


<div class="profile-container">

    <h2>
        My Profile
    </h2>


    <form method="POST">

        {% csrf_token %}


        <h3>
            Account Information
        </h3>

        {{ user_form.as_p }}


        <h3>
            Profile Information
        </h3>

        {{ profile_form.as_p }}


        <button
            type="submit"
            class="save-button"
        >
            Save Changes
        </button>

    </form>


    <div class="profile-links">

        <a href="{% url 'website:index' %}">
            Back to Home
        </a>


        <a
            href="{% url 'accounts:create-ticket' %}"
            class="ticket-link"
        >
            Send Ticket
        </a>


        <a
            href="{% url 'accounts:ticket-list' %}"
            class="ticket-link"
        >
            Tickets List
        </a>


        <a
            href="{% url 'accounts:logout' %}"
            class="logout-link"
        >
            Logout
        </a>

    </div>

</div>


</body>

</html>
