{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <title>My Profile</title>
</head>
<body>
<div class="container">

    </form>
    <br>
    <a href="{% url 'website:index' %}">
        Back to Home
    </a>

    <a href="{% url 'accounts:logout' %}">
        Logout
    </a>
    <br><br>
    <a href="{% url 'accounts:create-ticket' %}">send ticket</a>

    <a href="{% url "accounts:ticket-list" %}">tickets list</a>
</div>
</body>
</html>
